[package]
name = "sigmaos_user_manager"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS User Manager — user and group management with capability-aware privilege model"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sigma-user"
path = "src/main.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
